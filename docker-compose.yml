services:
  db:
    image: postgres:17-alpine
    command: ["postgres", "-c", "hba_file=/etc/postgresql/pg_hba.conf"]
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-55432}:5432"
    environment:
      POSTGRES_USER: meter
      POSTGRES_PASSWORD: meter
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-create-metering.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "psql -U meter -d metering -tAc 'SELECT 1' >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: service/Dockerfile
    environment:
      DATABASE_URL: postgresql://meter:meter@db:5432/metering
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in .env}
      PORT: 3000
      DB_POOL_SIZE: 20
    ports:
      - "127.0.0.1:${API_HOST_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in .env}
      API_BASE_URL: http://api:3000
    depends_on:
      api:
        condition: service_healthy
    command: ["demo"]
volumes:
  pgdata:
